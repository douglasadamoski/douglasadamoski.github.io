<style>
  * { box-sizing: border-box; }

  .navlink:hover { color: #0E7C66; }

    .site { border-left: none !important; border-right: none !important; }
    .nav-wrap { padding: 14px 20px !important; flex-wrap: wrap; gap: 10px !important; }

    .pad { padding-left: 20px !important; padding-right: 20px !important; }

    .hero h1 { font-size: 40px !important; }
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr !important; }
    .cv-strip { grid-template-columns: 1fr 1fr !important; }
    .cv-line { display: none !important; }

    .goals-grid > div { border-right: none !important; border-top: 1px solid #DCE5E0;

    .cvfull-row { grid-template-columns: 90px 1fr !important; gap: 14px !important; }
  }

  .lockbtn { cursor: help; }
  .lockbtn:hover, .lockbtn:focus-visible { opacity: .95 !important; border-color: #0E7C66 !important; color: #4C5C56 !important; }

  #locktip { position: fixed; z-index: 90; width: 286px; max-width: calc(100vw - 16px);

  #locktip a { color: #0E7C66; text-decoration: none; font-weight: 600; font-size: 12.5px; }
  #locktip a:hover { text-decoration: underline; }

function mapXY(lon, lat){
  const clamp = Math.max(-MAP.latMax, Math.min(MAP.latMax, lat));
  const mercy = l => Math.log(Math.tan(Math.PI/4 + l*Math.PI/360));
  const ymax = mercy(MAP.latMax), ymin = mercy(-MAP.latMax);
  return { xp: ((lon+180)/360)*100, yp: ((ymax - mercy(clamp))/(ymax - ymin))*100 };

function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function attr(s){ return esc(s); }
function decodeEmail(){ try { return atob(EMAIL_B64); } catch(e){ return ""; } }

/* italicise Latin species / genus names inside titles + descriptions.
   Longest phrases first so binomials win over the bare genus. */
const SPECIES = ["Streptococcus mutans","Phaseolus vulgaris","Glycine max","Zea mays",
  "Moniliophthora perniciosa","Colletotrichum gloeosporioides","Vochysia divergens",
  "Phyllosticta citricarpa","Candida","Pseudomonas","Colletotrichum"];
const SPECIES_RE = new RegExp("\\b(" + SPECIES
  .sort((a,b) => b.length - a.length)
  .map(s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "g");
/* sci(): HTML-escape THEN wrap species names in <em>. Species names contain no HTML
   metachars, so matching the escaped string is safe. Use wherever titles/descs render. */
function sci(text){ return esc(text).replace(SPECIES_RE, "<em>$1</em>"); }

const LOCK_SHUT = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* per-paper download link: bright open padlock when the file exists in assets/papers/<id>/,
   faded locked padlock otherwise (Douglas drops the file in later to unlock). */
function pdfDownload(available, href, label, p){
  if (available){
    return '<a href="'+attr(href)+'" download class="mono" style="display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:#0E7C66; text-decoration:none; border:1px solid #B8E0D4; background:#E9F5F0; border-radius:8px; padding:5px 11px;">'+LOCK_OPEN+esc(label)+'</a>';
  }
  const shut = 'display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500; color:#9CAAA3; border:1px dashed #CBD8D2; border-radius:8px; padding:5px 11px; opacity:.6;';
  // A paper whose PDF is withheld for licensing reasons gets a hoverable
  // explainer; anything else just isn't here yet.
  const code = p && p.restriction;
  if (code){
    return '<span class="mono lockbtn" tabindex="0" role="button"'
      + ' data-lock="'+attr(code)+'"'
      + ' data-doi="'+attr(p.url && p.url!=="#" ? p.url : "")+'"'
      + ' data-title="'+attr(p.title||"")+'"'
      + ' aria-label="'+attr(esc(label)+" - "+(state.lang==="pt"?"indisponível; ver motivo":"unavailable; see why"))+'"'
      + ' style="'+shut+' cursor:help;">'+LOCK_SHUT+esc(label)+'</span>';
  }
  return '<span class="mono" title="'+(state.lang==="pt"?"ainda não disponível":"not available yet")+'" style="'+shut+' cursor:not-allowed;">'+LOCK_SHUT+esc(label)+'</span>';
}


/* ---- locked-PDF explainer -------------------------------------------------
   Why a publisher PDF is missing, plus the two things a reader can actually do
   about it. One tooltip element on <body>, positioned with position:fixed, so
   the paper card's overflow:hidden cannot clip it. */
const RESTRICTION = {
  closed: {
    en: "The publisher holds exclusive rights to the published version, so the PDF cannot be hosted here.",
    pt: "A editora detém os direitos exclusivos da versão publicada, por isso o PDF não pode ser hospedado aqui."
  },
  bronze: {
    en: "Free to read on the publisher's site, but it carries no licence that allows the PDF to be redistributed.",
    pt: "Leitura gratuita no site da editora, mas sem licença que permita redistribuir o PDF."
  },
  green: {
    en: "Only the accepted manuscript may be self-archived — the publisher's typeset PDF cannot be posted here.",
    pt: "Apenas o manuscrito aceito pode ser autoarquivado — o PDF diagramado pela editora não pode ser publicado aqui."
  }
};
const TIPTXT = {
  en: { head: "Why this PDF isn't here", ask: "✉ Ask me for a copy",
        pub: "Read it at the publisher ↗", subj: "Reprint request: ",
        note: "I'm happy to send a personal copy." },
  pt: { head: "Por que este PDF não está aqui", ask: "✉ Peça uma cópia",
        pub: "Ler no site da editora ↗", subj: "Pedido de cópia: ",
        note: "Terei prazer em enviar uma cópia pessoal." }
};

(function(){
  var tip = null, hideT = null, cur = null;
  function el(){ return tip || (tip = document.getElementById("locktip")); }
  function near(ev, sel){ return ev.target && ev.target.closest ? ev.target.closest(sel) : null; }
  function fill(tr){
    var L = (state.lang === "pt") ? "pt" : "en", t = TIPTXT[L];
    var reason = (RESTRICTION[tr.getAttribute("data-lock")] || RESTRICTION.closed)[L];
    var doi = tr.getAttribute("data-doi") || "", title = tr.getAttribute("data-title") || "";
    var mail = "mailto:" + decodeEmail() + "?subject=" + encodeURIComponent(t.subj + title);
    var acts = '<a href="' + attr(mail) + '">' + t.ask + "</a>";
    if (doi) acts += '<a href="' + attr(doi) + '" target="_blank" rel="noopener">' + t.pub + "</a>";
    el().innerHTML = "<h4>" + esc(t.head) + "</h4><p>" + esc(reason) + " " + esc(t.note) + "</p>"
                   + '<div class="tipacts">' + acts + "</div>";
  }
  function place(tr){
    var e = el(), r = tr.getBoundingClientRect();
    var b = e.getBoundingClientRect();
    var left = r.left + r.width / 2 - b.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - b.width - 8));
    var top = r.top - b.height - 10;
    if (top < 8) top = r.bottom + 10;          // flip below when there is no room above
    e.style.left = left + "px"; e.style.top = top + "px";
  }
  function show(tr){
    clearTimeout(hideT); cur = tr; fill(tr);
    var e = el(); e.classList.add("on"); e.setAttribute("aria-hidden", "false");
    place(tr);
  }
  function hide(){
    hideT = setTimeout(function(){
      var e = el(); e.classList.remove("on"); e.setAttribute("aria-hidden", "true"); cur = null;
    }, 220);
  }
  document.addEventListener("mouseover", function(ev){
    var tr = near(ev, "[data-lock]");
    if (tr) { show(tr); return; }
    if (near(ev, "#locktip")) clearTimeout(hideT);     // let the pointer reach the links
  });
  document.addEventListener("mouseout", function(ev){
    if (near(ev, "[data-lock]") || near(ev, "#locktip")) hide();
  });
  document.addEventListener("focusin",  function(ev){ var tr = near(ev, "[data-lock]"); if (tr) show(tr); });
  document.addEventListener("focusout", function(ev){ if (near(ev, "[data-lock]")) hide(); });
  document.addEventListener("keydown",  function(ev){
    if (ev.key === "Escape" && cur) { clearTimeout(hideT); el().classList.remove("on"); cur = null; }
  });
  window.addEventListener("scroll", function(){ if (cur) place(cur); }, true);
  window.addEventListener("resize", function(){ if (cur) place(cur); });
})();

function chipRow(chips, kind){
  const cur = kind==="paper" ? state.paperTag : kind==="video" ? state.videoTag
            : kind==="role" ? state.paperRole : state.paperAff;
  return chips.map(c => {
    const active = c.value === cur;
    const accent = c.color || "#0E7C66";
    const base = "font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500; padding:7px 14px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:7px;";
    const st = active ? base+" background:"+accent+"; color:#fff; border:1px solid "+accent+";"
                      : base+" background:#fff; color:#4C5C56; border:1px solid #CBD8D2;";
    const dot = c.color ? '<span style="width:8px; height:8px; border-radius:50%; background:'+(active?"#fff":c.color)+';"></span>' : '';
    return '<span class="chip clickable" data-chip="'+kind+'" data-val="'+attr(c.value==null?"":c.value)+'" style="'+st+'">'+dot+esc(c.label)+'</span>';
  }).join("");
}

/* production-by-year stacked bar chart; stacking dimension cycles place/role/theme */
function barChartHTML(){
  const dim = state.stackBy;
  // categories present, in fixed order (theme: top 7 by frequency + "Other")
  let cats, themeTop;
  if (dim==="affiliation") cats = AFF.order.filter(a=>PAPERS.some(p=>(p.affiliation||"Other")===a));
  else if (dim==="role") cats = ROLE.order.filter(a=>PAPERS.some(p=>p.role===a));
  else {
    const f={}; PAPERS.forEach(p=>{const c=p.tags[0]||"Other"; f[c]=(f[c]||0)+1;});
    const ranked=Object.keys(f).sort((a,b)=>f[b]-f[a]);
    themeTop = new Set(ranked.slice(0,7));
    cats = ranked.slice(0,7).concat(ranked.length>7 ? ["Other"] : []);
  }
  const catOf = p => {
    if (dim==="affiliation") return p.affiliation||"Other";
    if (dim==="role") return p.role;
    const c = p.tags[0]||"Other"; return themeTop.has(c) ? c : "Other";
  };
  const colorOf = c => CHART_PALETTE[Math.max(0, cats.indexOf(c)) % CHART_PALETTE.length];
  const yrs = PAPERS.map(p=>parseInt(p.year)).filter(y=>!isNaN(y));
  if (!yrs.length) return "";
  const y0=Math.min(...yrs), y1=Math.max(...yrs), years=[];
  for (let y=y0;y<=y1;y++) years.push(y);
  const counts={}; years.forEach(y=>counts[y]={});
  PAPERS.forEach(p=>{ const y=parseInt(p.year); if(isNaN(y))return; const c=catOf(p); if(!cats.includes(c))return; counts[y][c]=(counts[y][c]||0)+1; });
  const maxC = Math.max(1, ...years.map(y=>cats.reduce((s,c)=>s+(counts[y][c]||0),0)));
  const W=1000,H=210,mL=30,mR=10,mT=8,mB=24, plotW=W-mL-mR, plotH=H-mT-mB, bw=plotW/years.length;
  const barW=Math.min(46, bw*0.66), yS=v=>plotH*v/maxC;
  let grid=""; const ticks=maxC<=5?maxC:5;
  for(let i=0;i<=ticks;i++){ const v=Math.round(maxC*i/ticks), yy=mT+plotH-yS(v);
    grid+='<line x1="'+mL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-mR)+'" y2="'+yy.toFixed(1)+'" stroke="#EDEAE3" stroke-width="1"/>'
      +'<text x="'+(mL-4)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#9CAAA3" font-family="IBM Plex Mono,monospace">'+v+'</text>'; }
  let bars="";
  years.forEach((y,xi)=>{ const cx=mL+bw*xi+bw/2; let acc=0;
    cats.forEach(c=>{ const v=counts[y][c]||0; if(!v)return;
      const full=yS(v), h=Math.max(1.2, full-2), yTop=mT+plotH-yS(acc)-full;  // 2px surface gap below each segment
      bars+='<rect x="'+(cx-barW/2).toFixed(1)+'" y="'+yTop.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+colorOf(c)+'"><title>'+esc(y+" · "+c+": "+v)+'</title></rect>'; acc+=v; });
    if (years.length<=16 || xi%2===0)
      bars+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#7A897F" font-family="IBM Plex Mono,monospace">’'+String(y).slice(2)+'</text>'; });
  const svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" style="width:100%; height:auto; display:block;">'+grid+bars+'</svg>';
  const legend = cats.map(c=>'<span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#4C5C56;"><span style="width:10px; height:10px; border-radius:3px; background:'+colorOf(c)+';"></span>'+esc(c)+'</span>').join("");
  const dimLabel = dim==="affiliation" ? (state.lang==="pt"?"instituição":"place") : dim==="role" ? (state.lang==="pt"?"papel":"role") : (state.lang==="pt"?"tema":"theme");
  return '<div style="border:1px solid #DCE5E0; border-radius:14px; background:#fff; padding:16px 18px 12px; margin-bottom:26px;">'
    + '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:8px;">'
    +   '<div class="mono" style="font-size:12px; font-weight:500; letter-spacing:.06em; color:#7A897F;">'+(state.lang==="pt"?"// PRODUÇÃO POR ANO":"// PRODUCTION BY YEAR")+'</div>'
    +   '<span class="clickable mono" data-stackcycle="1" style="font-size:12px; font-weight:500; color:#14201C; border:1px solid #C6D2CC; background:#fff; border-radius:7px; padding:5px 11px;">↻ '+(state.lang==="pt"?"empilhar por: ":"stack by: ")+esc(dimLabel)+'</span>'
    + '</div>' + svg
    + '<div style="display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;">'+legend+'</div></div>';
}

/* paper filtering + row rendering, split out so search can update ONLY the results
   container (leaving the <input> alive → no focus loss, no broken IME/accents) */
function paperVisible(){
  const q = state.paperSearch.toLowerCase().trim();
  return PAPERS.filter(p => {
    const okTag = !state.paperTag || p.tags.includes(state.paperTag);
    const okAff = !state.paperAff || (p.affiliation||"Other") === state.paperAff;
    const okRole = !state.paperRole || p.role === state.paperRole;
    const hay = (p.title+" "+(p.desc||"")+" "+p.tags.join(" ")+" "+p.venue+" "
      +(p.affiliation||"")+" "+(p.authors||[]).join(" ")).toLowerCase();
    return okTag && okAff && okRole && (!q || hay.includes(q));
  });
}
function paperRowsHTML(vis, t){
  if (!vis.length) return '<div class="mono" style="text-align:center; padding:60px 0; color:#9CAAA3; font-size:14px;">'+esc(t.noResults)+'</div>';
  const rows = vis.map(p => {
    const tagPills = p.tags.map(tg => '<span class="mono" style="font-size:11px; color:#4C5C56; background:#EEF3F0; border:1px solid #DCE5E0; border-radius:999px; padding:3px 10px;">'+esc(tg)+'</span>').join("");
    const badge = p.highImpact ? '<span class="mono" style="font-size:10px; color:#0E7C66; background:#E4F2ED; border:1px solid #B8E0D4; border-radius:999px; padding:3px 9px; margin-left:8px;">★ high-impact</span>' : (p.preprint ? '<span class="mono" style="font-size:10px; color:#9C6B00; background:#FBF2DD; border:1px solid #ecdcae; border-radius:999px; padding:3px 9px; margin-left:8px;">preprint</span>' : '');
    const affPill = p.affiliation ? '<span class="mono" style="font-size:10px; color:#fff; background:'+(AFF.color[p.affiliation]||"#5E6D64")+'; border-radius:999px; padding:3px 10px;">'+esc(p.affiliation)+'</span>' : '';
    const githubTag = p.github ? '<a href="'+attr(p.github)+'" target="_blank" rel="noopener" class="mono" style="font-size:11px; color:#14201C; background:#EEF3F0; border:1px solid #CBD8D2; border-radius:999px; padding:3px 10px; text-decoration:none; display:inline-flex; align-items:center; gap:5px;">◆ GitHub</a>' : '';
    const jb = jbannerHTML(p);
    const authors = (p.authors && p.authors.length)
      ? '<div style="font-size:12.5px; line-height:1.55; color:#4C5C56;">'
        + p.authors.map(a => /adamoski/i.test(a) ? '<strong style="color:#14201C;">'+esc(a)+'</strong>' : esc(a)).join(", ")
        + '</div>' : '';
    // author-role badges. Only the position-based "first author" is shown — it's
    // verifiable from the author order. (co-first / corresponding pending a reliable source.)
    const goldPill = "font-size:10px; color:#8A6D1A; background:#FBF4E0; border:1px solid #E7D6A6; border-radius:999px; padding:3px 9px;";
    const tealPill = "font-size:10px; color:#0E7C66; background:#E4F2ED; border:1px solid #B8E0D4; border-radius:999px; padding:3px 9px;";
    const roleParts = [];
    if (p.coFirst) roleParts.push('<span class="mono" style="'+goldPill+'">★ '+(state.lang==="pt"?"Coprimeiro autor":"Co-first author")+'</span>');
    else if (p.firstAuthor) roleParts.push('<span class="mono" style="'+goldPill+'">★ '+(state.lang==="pt"?"Primeiro autor":"First author")+'</span>');
    if (p.corresponding) roleParts.push('<span class="mono" style="'+tealPill+'">✉ '+(state.lang==="pt"?"Autor correspondente":"Corresponding author")+'</span>');
    const roleBadges = roleParts.length ? '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:3px;">'+roleParts.join("")+'</div>' : '';
    const dl = '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px;">'
      + pdfDownload(p.pdfMain, p.pdfMainHref, "PDF", p)
      + pdfDownload(p.pdfSuppl, p.pdfSupplHref, (state.lang==="pt"?"Suplementar":"Supplementary"))
      + (p.url && p.url!=="#" ? '<a href="'+attr(p.url)+'" target="_blank" rel="noopener" class="mono" style="font-size:13px; font-weight:500; color:#0E7C66; text-decoration:none;">'+esc(t.readPaper)+'</a>' : '')
      + '</div>';
    return '<div id="paper-'+attr(p.id)+'" class="paper-card hovcard hov-flat" style="border:1px solid #DCE5E0; border-radius:14px; overflow:hidden; background:#fff; scroll-margin-top:90px;">'
      + jb
      + '<div class="paper-row" style="display:grid; grid-template-columns:300px 1fr;">'
      +   '<div class="figwrap" style="position:relative; min-height:200px; border-right:1px solid #DCE5E0; background:#EEF3F0;">'+figSlot(p,"")+'</div>'
      +   '<div style="padding:22px 28px 24px; display:flex; flex-direction:column; gap:9px;">'
      +     '<div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px;">'
      +       '<span class="mono" style="font-size:12px; color:#0E7C66;">'+esc(p.venue)+badge+'</span>'
      +       '<span class="mono" style="font-size:12px; color:#9CAAA3;">'+esc(p.year)+'</span></div>'
      +     '<div style="font-size:21px; font-weight:700; line-height:1.25; letter-spacing:-.01em;">'+sci(p.title)+'</div>'
      +     authors
      +     roleBadges
      +     (p.desc ? '<div style="font-size:14px; line-height:1.6; color:#3D4A45; margin-top:2px;">'+sci(p.desc)+'</div>' : '')
      +     '<div style="display:flex; gap:7px; flex-wrap:wrap; margin-top:4px; align-items:center;">'+affPill+githubTag+tagPills+'</div>'
      +     dl
      +   '</div>'
      + '</div></div>';
  }).join("");
  return '<div style="display:flex; flex-direction:column; gap:20px;">'+rows+'</div>';
}

/* short helper: start of a longer text (for conference abstract cards) */
function abbr(s, n){ s=String(s||"").trim(); if(s.length<=n) return s;
  const c=s.slice(0,n), d=c.lastIndexOf(". "); return d>=n*0.6 ? c.slice(0,d+1) : c.replace(/\s+\S*$/,"")+"…"; }

function conferencesHTML(t){
  const items = CONFERENCES || [];
  const head = '<h2 style="font-size:36px; font-weight:700; letter-spacing:-.02em; margin:0 0 8px;">'+esc(t.confTitle)+'</h2>'
    + '<p style="font-size:15px; color:#4C5C56; margin:0 0 24px; max-width:640px;">'+esc(t.confSub)+'</p>';
  if (!items.length){
    return '<div class="pad" style="padding:52px 48px 80px;">'+head
      + '<div class="mono" style="text-align:center; padding:70px 20px; color:#9CAAA3; font-size:14px; border:1px dashed #DCE5E0; border-radius:14px;">'+esc(t.comingSoon)+'</div></div>';
  }
  const q = (state.confSearch||"").toLowerCase().trim();
  const vis = items.filter(c => {
    const hay = (c.title+" "+(c.event||"")+" "+(c.abstract||"")+" "+((c.tags||[]).join(" "))+" "+((c.authors||[]).join(" "))).toLowerCase();
    return !q || hay.includes(q);
  });
  const cards = vis.map(c => {
    const talk = c.type==="talk" ? '<span class="mono" style="font-size:10px; color:#8A6D1A; background:#FBF4E0; border:1px solid #E7D6A6; border-radius:999px; padding:3px 9px; margin-left:8px;">★ '+esc(t.talkBadge)+'</span>' : '';
    const authors = (c.authors && c.authors.length) ? '<div style="font-size:12.5px; color:#4C5C56; line-height:1.55;">'+c.authors.map(a=>/adamoski/i.test(a)?'<strong style="color:#14201C;">'+esc(a)+'</strong>':esc(a)).join(", ")+'</div>' : '';
    const desc = c.abstract ? '<div style="font-size:14px; line-height:1.6; color:#3D4A45; margin-top:2px;">'+sci(abbr(c.abstract,240))+'</div>' : '';
    const tagPills = (c.tags||[]).map(tg=>'<span class="mono" style="font-size:11px; color:#4C5C56; background:#EEF3F0; border:1px solid #DCE5E0; border-radius:999px; padding:3px 10px;">'+esc(tg)+'</span>').join("");
    return '<div class="paper-row hovcard hov-flat" style="border:1px solid #DCE5E0; border-radius:14px; overflow:hidden; background:#fff; padding:22px 26px; display:flex; flex-direction:column; gap:9px;">'
      + '<div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px;">'
      +   '<span class="mono" style="font-size:12px; color:#0E7C66;">'+esc(c.event||"")+talk+'</span>'
      +   '<span class="mono" style="font-size:12px; color:#9CAAA3;">'+esc(c.year||"")+'</span></div>'
      + '<div style="font-size:20px; font-weight:700; line-height:1.25;">'+sci(c.title||"")+'</div>'
      + authors + desc
      + (tagPills ? '<div style="display:flex; gap:7px; flex-wrap:wrap; margin-top:4px;">'+tagPills+'</div>' : '')
      + (c.url ? '<a href="'+attr(c.url)+'" target="_blank" rel="noopener" class="mono" style="margin-top:4px; font-size:13px; font-weight:500; color:#0E7C66; text-decoration:none;">'+esc(t.readPaper)+'</a>' : '')
      + '</div>';
  }).join("");
  return '<div class="pad" style="padding:52px 48px 60px;">'+head
    + '<div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:22px;">'+searchBox("confSearch", state.confSearch, t.searchConf)+'</div>'
    + '<div id="confCount" class="mono" style="font-size:12px; color:#7A897F; margin-bottom:16px;">'+fmtCount(vis.length)+'</div>'
    + (vis.length ? '<div style="display:flex; flex-direction:column; gap:20px;">'+cards+'</div>'
        : '<div class="mono" style="text-align:center; padding:60px 0; color:#9CAAA3; font-size:14px;">'+esc(t.noResults)+'</div>')
    + '</div>';
}

    + '<span>© 2026 Douglas Adamoski</span>'

/* ---------------- render + events ---------------- */
function render(){
  const t = TXT[state.lang];
  let body = "";
  if (state.page==="home") body = homeHTML(t);
  else if (state.page==="papers") body = papersHTML(t);
  else if (state.page==="conferences") body = conferencesHTML(t);
  else if (state.page==="videos") body = videosHTML(t);
  else if (state.page==="github") body = githubHTML(t);
  else if (state.page==="awards") body = awardsHTML(t);
  else if (state.page==="about") body = aboutHTML(t);
  // remember which control had keyboard focus, so a full re-render doesn't drop it
  const ae = document.activeElement;
  let refocus = null;
  if (ae && ae.classList && ae.classList.contains("clickable")){
    refocus = { go:ae.getAttribute("data-go"), lang:ae.getAttribute("data-lang"),
      shuffle:ae.getAttribute("data-shuffle"), chip:ae.getAttribute("data-chip"),
      val:ae.getAttribute("data-val") };
  }

  document.getElementById("app").innerHTML = navHTML(t) + '<main>' + body + '</main>' + footerHTML(t);
  document.documentElement.lang = state.lang;

  // make the span/div controls keyboard-operable (focusable + button semantics)
  document.querySelectorAll("#app .clickable").forEach(el => {
    el.setAttribute("tabindex", "0");
    el.setAttribute("role", "button");
  });

  // restore keyboard focus to the equivalent control after the re-render.
  // CSS.escape guards against attribute values with quotes/brackets; try/catch is belt-and-braces.
  if (refocus){
    const ce = (window.CSS && CSS.escape) ? CSS.escape.bind(CSS) : (x => x);
    let sel = null;
    if (refocus.chip != null) sel = '[data-chip="'+ce(refocus.chip)+'"][data-val="'+ce(refocus.val||"")+'"]';
    else if (refocus.shuffle != null) sel = '[data-shuffle]';
    else if (refocus.lang != null) sel = '[data-lang="'+ce(refocus.lang)+'"]';
    else if (refocus.go != null) sel = '[data-go="'+ce(refocus.go)+'"]';
    if (sel){ try { const el = document.querySelector("#app "+sel); if (el) el.focus(); } catch(e){} }
  }

  // deep-link: after jumping from a featured card, scroll to + flash that paper
  if (state.page === "papers" && state.focusPaper){
    const el = document.getElementById("paper-" + state.focusPaper);
    state.focusPaper = null;
    if (el){
      if (el.scrollIntoView) el.scrollIntoView({ behavior:"smooth", block:"start" });
      el.classList.add("paper-flash");
      setTimeout(() => el.classList.remove("paper-flash"), 1800);
    }
  }

  // search updates ONLY the results container (the <input> stays alive → focus + IME kept)
  const ps = document.getElementById("paperSearch");
  if (ps) ps.addEventListener("input", e => { state.paperSearch = e.target.value; refreshPapers(); });
  const vs = document.getElementById("videoSearch");
  if (vs) vs.addEventListener("input", e => { state.videoSearch = e.target.value; refreshVideos(); });
  const cs = document.getElementById("confSearch");
  if (cs) cs.addEventListener("input", e => { state.confSearch = e.target.value; render(); });
}

document.addEventListener("click", e => {
  // reveal the email only on click (assembled from base64 — never in the static DOM)
  const re = e.target.closest("[data-reveal-email]");
  if (re){
    const em = decodeEmail();
    re.outerHTML = '<a href="mailto:'+em+'" style="color:#0E7C66; text-decoration:none;">✉ '+em+'</a>';
    return;
  }
  // a featured card jumps to THAT paper on the Papers page (clear filters so it's visible)
  const pc = e.target.closest("[data-paper]");
  if (pc){
    state.paperTag = null; state.paperAff = null; state.paperSearch = "";
    state.focusPaper = pc.getAttribute("data-paper");
    go("papers"); return;
  }
  const g = e.target.closest("[data-go]");
  if (g){ go(g.getAttribute("data-go")); return; }
  const l = e.target.closest("[data-lang]");
  if (l){ state.lang = l.getAttribute("data-lang"); render(); return; }
  const s = e.target.closest("[data-shuffle]");
  if (s){ state.homeOffset++; render(); return; }
  const c = e.target.closest("[data-chip]");
  if (c){
    const val = c.getAttribute("data-val") || null;
    const kind = c.getAttribute("data-chip");
    if (kind==="paper") state.paperTag = val;
    else if (kind==="video") state.videoTag = val;
    else if (kind==="aff") state.paperAff = val;
    else if (kind==="role") state.paperRole = val;
    render(); return;
  }
  const sc = e.target.closest("[data-stackcycle]");
  if (sc){
    const dims = ["affiliation","role","theme"];
    state.stackBy = dims[(dims.indexOf(state.stackBy)+1) % dims.length];
    render(); return;
  }
});

// Enter / Space activate the role=button span/div controls (keyboard a11y)
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
  const el = e.target.closest && e.target.closest(".clickable");
  if (el){ e.preventDefault(); el.click(); }
});

// trajectory hover/focus -> red dot at that city on the Mercator map
function cityShow(it){
  const dot = document.getElementById("mapDot"), lbl = document.getElementById("mapLabel");
  if (!dot || !it) return;
  const xy = mapXY(parseFloat(it.getAttribute("data-lon")), parseFloat(it.getAttribute("data-lat")));
  dot.style.left = xy.xp+"%"; dot.style.top = xy.yp+"%"; dot.style.opacity = "1";
  if (lbl){ lbl.textContent = it.getAttribute("data-city")||""; lbl.style.left = xy.xp+"%"; lbl.style.top = xy.yp+"%"; lbl.style.opacity = "1"; }
}
function cityHide(){
  const dot = document.getElementById("mapDot"), lbl = document.getElementById("mapLabel");
  if (dot) dot.style.opacity = "0"; if (lbl) lbl.style.opacity = "0";
}
["mouseover","focusin"].forEach(ev => document.addEventListener(ev, e => {
  const it = e.target.closest && e.target.closest("[data-lat]"); if (it) cityShow(it);
}));
["mouseout","focusout"].forEach(ev => document.addEventListener(ev, e => {
  const it = e.target.closest && e.target.closest("[data-lat]"); if (it) cityHide();
}));

render();
</script>
