<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Beating Heart AR</title>
  <script src="vendor/aframe.min.js"></script>
  <script src="vendor/aframe-ar.min.js"></script>
  <script src="heart.js"></script>
</head>
<body style="margin:0; background:#000; overflow:hidden;">
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="alpha: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Camera with lighting so the heart looks 3D and shaded -->
    <a-entity camera></a-entity>
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 1.1; position: 1 1 1"></a-entity>
    <a-entity light="type: directional; intensity: 0.5; position: -1 0.5 -1"></a-entity>

    <!-- The printed HIRO marker. Place the heart on it. -->
    <a-marker preset="hiro" id="marker">
      <a-entity heart="color: #e0244a"></a-entity>
    </a-marker>
  </a-scene>

  <!-- Overlay instructions (plain DOM, outside the WebGL scene) -->
  <div id="overlay" style="position:fixed; top:10px; left:10px; background:rgba(0,0,0,0.6); color:white; padding:8px; font-family:sans-serif; z-index:1000; border-radius:4px;">
    Point the camera at the printed Hiro marker.<br/>Hold steady for the heart to appear.
  </div>
</body>
</html>
